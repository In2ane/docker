version: '3.8'

services:
  nginx:
    image: "nginx:stable"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/laravel
    depends_on:
      - mysql
      - php
      
  php:
    build: 
      dockerfile: ./php/Dockerfile
    volumes:
       - ./src:/var/www/laravel
    depends_on:
      - mysql
    restart: always

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - ./mysql/mysql.env
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always
    
  phpmyadmin:
    image: phpmyadmin
    ports:
      - 8080:80
    environment:
      - PMA_HOST=mysql
    restart: always
    depends_on:
      - mysql
      - php

volumes:
  db_data: